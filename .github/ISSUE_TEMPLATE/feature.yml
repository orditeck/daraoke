name: Feature proposal
description: Propose a focused change for a release.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Related milestone or issue
